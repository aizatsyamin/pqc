<fieldset class="row mb-3 align-items-center">
  <!-- Label on Left -->
  <legend class="col-form-label col-sm-2 pt-0">
    Action Type <span class="text-danger">*</span>
  </legend>

  <!-- Radio Options on Right -->
  <div class="col-sm-10">
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="actionType" id="stockIn" value="STOCK_IN" checked>
      <label class="form-check-label" for="stockIn">Stock In</label>
    </div>

    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="actionType" id="stockOut" value="STOCK_OUT">
      <label class="form-check-label" for="stockOut">Stock Out</label>
    </div>
  </div>
</fieldset>
