<div class="container mt-4">
    <!-- Step Header Wrapper -->
    <div class="row mb-4 text-center">
        <!-- Step 1: Initiate -->
        <div class="col-md-4">
            <div id="step-header-1" class="step-card step-active">
                <span class="step-number">1</span> Initiate
            </div>
        </div>
        <!-- Step 2: Confirm -->
        <div class="col-md-4">
            <div id="step-header-2" class="step-card step-disabled">
                <span class="step-number">2</span> Confirm
            </div>
        </div>
        <!-- Step 3: Acknowledge -->
        <div class="col-md-4">
            <div id="step-header-3" class="step-card step-disabled">
                <span class="step-number">3</span> Acknowledge
            </div>
        </div>
    </div>

    <!-- Main Content Panel -->
    <div class="card p-4 shadow-sm">
        <form id="wizardForm">
            
            <!-- SECTION 1: INITIATE FORM FIELDS -->
            <div id="step-content-1" class="form-step-section">
                <h5 class="mb-4 text-secondary border-bottom pb-2">Location Details</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label text-muted small">Inventory Location <span class="text-danger">*</span></label>
                        <input type="text" id="inputLocation" class="form-control" value="test" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small">Status <span class="text-danger">*</span></label>
                        <select id="inputStatus" class="form-select">
                            <option value="Active" selected>Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                    <div class="col-12 mt-3">
                        <label class="form-label text-muted small">Description</label>
                        <textarea id="inputDescription" class="form-control" rows="2">test</textarea>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <button type="button" class="btn btn-outline-secondary px-4">Cancel</button>
                    <button type="button" class="btn btn-danger px-4" onclick="goToStep(2)">Next</button>
                </div>
            </div>

            <!-- SECTION 2: CONFIRMATION VIEW -->
            <div id="step-content-2" class="form-step-section d-none">
                <h5 class="mb-4 text-secondary border-bottom pb-2">Review Location Details</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <p class="text-muted small mb-1">Inventory Location</p>
                        <p class="fw-semibold" id="reviewLocation">-</p>
                    </div>
                    <div class="col-md-6">
                        <p class="text-muted small mb-1">Description</p>
                        <p class="fw-semibold" id="reviewDescription">-</p>
                    </div>
                    <div class="col-md-6">
                        <p class="text-muted small mb-1">Status</p>
                        <p class="fw-semibold" id="reviewStatus">-</p>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <button type="button" class="btn btn-outline-secondary px-4" onclick="goToStep(1)">Back</button>
                    <button type="button" class="btn btn-danger px-4" onclick="goToStep(3)">Confirm & Submit</button>
                </div>
            </div>

            <!-- SECTION 3: SUCCESS ACKNOWLEDGEMENT -->
            <div id="step-content-3" class="form-step-section d-none text-center py-4">
                <!-- Green Success Icon Wrap -->
                <div class="mb-3 text-success fs-1">
                    <i class="bi bi-check-circle-fill"></i> <!-- standard Bootstrap Icon -->
                </div>
                <h5 class="fw-semibold mb-4">Inventory Location Created Successfully</h5>
                
                <div class="row g-3 justify-content-center text-start border p-3 rounded bg-light max-width-review mx-auto mb-4" style="max-width: 500px;">
                    <div class="col-md-6">
                        <p class="text-muted small mb-1">Inventory Location</p>
                        <p class="fw-semibold" id="finalLocation">-</p>
                    </div>
                    <div class="col-md-6">
                        <p class="text-muted small mb-1">Description</p>
                        <p class="fw-semibold" id="finalDescription">-</p>
                    </div>
                    <div class="col-md-6">
                        <p class="text-muted small mb-1">Status</p>
                        <p class="fw-semibold" id="finalStatus">-</p>
                    </div>
                </div>
                
                <button type="button" class="btn btn-danger px-5" onclick="resetWizard()">Done</button>
            </div>

        </form>
    </div>
</div>
