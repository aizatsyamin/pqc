<!-- ========================================== -->
<!-- 1. SUMMARY METRIC CARDS ROW               -->
<!-- ========================================== -->
<div class="row g-3 mb-4">
    <!-- Total Inventory Value -->
    <div class="col-md-3">
        <div class="card p-4 shadow-sm h-100 bg-white border border-light">
            <div class="d-flex align-items-center gap-3">
                <div class="rounded-2 bg-light-danger p-3 text-danger d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                    <i class="fs-4 fw-bold">$</i>
                </div>
                <div>
                    <span class="text-muted d-block small mb-1">Total Inventory Value</span>
                    <h4 class="fw-bold text-dark mb-0">MYR 11,613.7</h4>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Total SKUs -->
    <div class="col-md-3">
        <div class="card p-4 shadow-sm h-100 bg-white border border-light">
            <div class="d-flex align-items-center gap-3">
                <div class="rounded-2 bg-light-success p-3 text-success d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                    <i class="fs-4 fw-bold">&#128451;</i>
                </div>
                <div>
                    <span class="text-muted d-block small mb-1">Total SKUs</span>
                    <h4 class="fw-bold text-dark mb-0">8</h4>
                </div>
            </div>
        </div>
    </div>

    <!-- Total Stock In -->
    <div class="col-md-3">
        <div class="card p-4 shadow-sm h-100 bg-white border border-light">
            <div class="d-flex align-items-center gap-3">
                <div class="rounded-2 bg-light-primary p-3 text-primary d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                    <i class="fs-4 fw-bold">+</i>
                </div>
                <div>
                    <span class="text-muted d-block small mb-1">Total Stock In</span>
                    <h4 class="fw-bold text-dark mb-0">3,752 units</h4>
                </div>
            </div>
        </div>
    </div>

    <!-- Total Stocks Out -->
    <div class="col-md-3">
        <div class="card p-4 shadow-sm h-100 bg-white border border-light">
            <div class="d-flex align-items-center gap-3">
                <div class="rounded-2 bg-light-warning p-3 text-warning d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                    <i class="fs-4 fw-bold">-</i>
                </div>
                <div>
                    <span class="text-muted d-block small mb-1">Total Stocks Out</span>
                    <h4 class="fw-bold text-dark mb-0">483 units</h4>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ========================================== -->
<!-- 2. FILTER SEARCH FILTERS PANEL            -->
<!-- ========================================== -->
<div class="row g-3 align-items-end mb-4">
    <div class="col-md-3">
        <label class="form-label text-muted small fw-semibold">Status</label>
        <select id="filterStatus" class="form-select" data-control="select2">
            <option value="">All Status</option>
            <option value="In Stock">In Stock</option>
            <option value="Low Stock">Low Stock</option>
        </select>
    </div>
    <div class="col-md-3">
        <label class="form-label text-muted small fw-semibold">Category</label>
        <select id="filterCategory" class="form-select" data-control="select2">
            <option value="">All Categories</option>
            <c:forEach var="cat" items="${categoryList}">
                <option value="${cat}">${cat}</option>
            </c:forEach>
        </select>
    </div>
    <div class="col-md-6">
        <label class="form-label text-muted small fw-semibold">Search</label>
        <input type="text" id="customSearchInput" class="form-control" placeholder="Search SKU or product name..." autocomplete="off">
    </div>
</div>

<!-- ========================================== -->
<!-- 3. DATA TABLE WRAPPER                     -->
<!-- ========================================== -->
<div class="card shadow-sm border rounded bg-white">
    <!-- Header Controls inside data section -->
    <div class="card-header d-flex align-items-center justify-content-between bg-light-danger py-3 border-0">
        <h5 class="card-title fw-bold text-dark m-0 fs-6">Stocks & Movement</h5>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary px-3 bg-white" id="btnExport">
                <i class="bi bi-download me-1"></i> Export
            </button>
            <button type="button" class="btn btn-sm btn-danger px-3" id="btnManageStocks">
                + Manage Stocks
            </button>
        </div>
    </div>
    
    <!-- Table Frame -->
    <div class="card-body p-0">
        <div class="table-responsive">
            <table id="stockMovementTable" class="table align-middle table-row-dashed fs-6 gy-5 mx-0 w-100">
                <thead>
                    <tr class="text-start text-muted fw-bold fs-7 text-uppercase gs-0 bg-light border-bottom">
                        <th class="ps-4">SKU</th>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Available Qty</th>
                        <th>Reorder Point</th>
                        <th>Unit Cost</th>
                        <th>Stock Value</th>
                        <th>Last Movement</th>
                        <th class="pe-4">Status</th>
                    </tr>
                </thead>
                <tbody class="text-gray-700 fw-semibold">
                    <!-- Data handles rows automatically inside client JS controller -->
                </tbody>
            </table>
        </div>
    </div>
</div>
